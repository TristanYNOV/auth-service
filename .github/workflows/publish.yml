name: Publish Docker image

on:
  push:
    branches:
      - prod

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  docker:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive image name
        id: image
        run: |
          owner_lower=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner_lower}/auth-service" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=prod
            type=raw,value=sha-${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build_push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish summary
        run: |
          {
            echo "## GHCR publication"
            echo ""
            echo "- Image: \\`${{ steps.image.outputs.name }}\\`"
            echo "- Tag prod: \\`${{ steps.image.outputs.name }}:prod\\`"
            echo "- Tag sha: \\`${{ steps.image.outputs.name }}:sha-${{ github.sha }}\\`"
            echo "- Digest: \\`${{ steps.build_push.outputs.digest }}\\`"
            echo ""
            echo "> Rappel: le repo infra devrait idéalement déployer l'image via ce digest (référence immuable)."
          } >> "$GITHUB_STEP_SUMMARY"
