name: Publish Docker image

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  docker:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate stable SemVer tag
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '${GITHUB_REF_NAME}' n'est pas un tag SemVer stable (attendu: vX.Y.Z)."
            exit 1
          fi

      - name: Ensure tagged commit is on origin/prod
        run: |
          git fetch --no-tags origin prod

          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/prod"; then
            echo "Le commit taggé (${GITHUB_SHA}) n'appartient pas à l'historique de origin/prod."
            exit 1
          fi

      - name: Derive image name
        id: image
        run: |
          owner_lower=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner_lower}/auth-service" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=prod
            type=raw,value=sha-${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build_push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish summary
        run: |
          {
            echo "## GHCR publication"
            echo ""
            echo "- Image: \`${{ steps.image.outputs.name }}\`"
            echo "- Tag version: \`${{ steps.image.outputs.name }}:${{ github.ref_name }}\`"
            echo "- Tag prod: \`${{ steps.image.outputs.name }}:prod\`"
            echo "- Tag sha: \`${{ steps.image.outputs.name }}:sha-${{ github.sha }}\`"
            echo "- Digest: \`${{ steps.build_push.outputs.digest }}\`"
            echo ""
            echo "> Rappel: le repo infra devrait idéalement déployer l'image via ce digest (référence immuable)."
          } >> "$GITHUB_STEP_SUMMARY"
