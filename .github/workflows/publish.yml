name: Publish Docker image

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  docker:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate stable SemVer tag
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '${GITHUB_REF_NAME}' n'est pas un tag SemVer stable (attendu: vX.Y.Z)."
            exit 1
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Ensure tagged commit is on origin/prod
        run: |
          git fetch origin prod

          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/prod"; then
            echo "Le commit taggé (${GITHUB_SHA}) n'appartient pas à l'historique de origin/prod."
            exit 1
          fi

      - name: Derive image name
        id: image
        run: |
          owner_lower=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner_lower}/auth-service" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=raw,value=prod
            type=raw,value=${{ env.VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build_push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish summary
        run: |
          {
            echo "## GHCR publication"
            echo ""
            echo "- Image: \`${{ steps.image.outputs.name }}\`"
            echo "- Tag latest: \`${{ steps.image.outputs.name }}:latest\`"
            echo "- Tag prod: \`${{ steps.image.outputs.name }}:prod\`"
            echo "- Tag version: \`${{ steps.image.outputs.name }}:${{ env.VERSION }}\`"
            echo "- Digest: \`${{ steps.build_push.outputs.digest }}\`"
            echo ""
            echo "> Rappel: le repo infra devrait idéalement déployer l'image via ce digest (référence immuable)."
          } >> "$GITHUB_STEP_SUMMARY"

  trigger-infra-deploy:
    name: Trigger infra deployment for auth-service
    runs-on: ubuntu-latest
    needs: docker
    if: ${{ success() && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: read
    steps:
      - name: Validate SemVer tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag ${TAG} is not a valid SemVer tag like v1.0.0"
            exit 1
          fi

      - name: Trigger infra deploy workflow
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.INFRA_WORKFLOW_TOKEN }}
          SERVICE: auth-service
          VERSION_TAG: ${{ github.ref_name }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          payload="$(jq -nc \
            --arg ref "prod" \
            --arg service "${SERVICE}" \
            --arg version_tag "${VERSION_TAG}" \
            --arg source_repository "${SOURCE_REPOSITORY}" \
            --arg source_sha "${SOURCE_SHA}" \
            '{
              ref: $ref,
              inputs: {
                service: $service,
                version_tag: $version_tag,
                source_repository: $source_repository,
                source_sha: $source_sha
              }
            }')"

          curl --fail-with-body -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/tristanynov/infra/actions/workflows/deploy-prod.yml/dispatches \
            -d "${payload}"
