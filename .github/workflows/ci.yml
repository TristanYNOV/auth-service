name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping').ok\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: mongodb://localhost:27017
      DB_NAME: auth_service_ci
      JWT_SECRET: ci_secret_only_not_prod
      JWT_EXPIRES_IN: 15m
      STRICT_ENV: false
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: admin_ci_password
      ADMIN_PSEUDO: admin
      JWT_ISSUER: ''
      JWT_AUDIENCE: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: E2E tests
        run: npm run test:e2e
